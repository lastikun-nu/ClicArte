<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <title>Gestión de aulas | ClicArte</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="../css/main.css">
        <script src="../js/theme.js"></script>
        <script src="../js/sidebar.js" defer></script>
    </head>
<body class="page-app">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
    <section class="app-shell">
        <aside class="sidebar">
            <header class="logopaginas">
                <a href="../comun/dashboard.html">
                    <img src="../IMGBLANCO/logo_completo_negativp.png" alt="ClicArte, ir al panel principal">
                </a>
            </header>
            <nav class="sidebar-nav" aria-label="Navegación principal" data-role="profesor" data-active="aulas"></nav>
            <a href="../comun/index.html" class="logout">Cerrar Sesión</a>
        </aside>
        <main class="content-wrapper">
            <section class="barra-preferencias" aria-label="Idioma y tema">
                <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false"><i class="fa-solid fa-moon" aria-hidden="true"></i>Tema oscuro</button>
            </section>
            <header class="top-header">
                <h1>Gestión de aulas</h1>
                <p class="user-info">Profesor</p>
            </header>
            <section class="main-content" id="contenido">
                <p>Listado de equipos y alumnos asignados a cada aula.</p>
                <article class="aula-container">
                    <header class="aula-header">
                        <h2>Planta # - Aula #</h2>
                    </header>
                    <section class="aula-body">
                        <section class="aula-columna">
                            <h3>Equipos en esta aula</h3>
                            <ul><li># - # (Estado #)</li></ul>
                        </section>
                        <section class="aula-columna">
                            <h3>Alumnos asignados a esta aula</h3>
                            <ul><li>#</li></ul>
                        </section>
                    </section>
                </article>
            </section>
        </main>
    </section>
</body>
</html>

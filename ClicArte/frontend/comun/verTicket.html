<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <title>Detalle del ticket | ClicArte</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="../css/main.css">
        <script src="../js/theme.js"></script>
        <script src="../js/sidebar.js" defer></script>
        <script src="../js/nuno.js" defer></script>
    </head>
<body class="page-app">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
    <section class="app-shell">
        <aside class="sidebar">
            <header class="logopaginas">
                <a href="../comun/dashboard.html">
                    <img src="../IMGBLANCO/logo_completo_negativp.png" alt="ClicArte, ir al panel principal">
                </a>
            </header>
            <nav class="sidebar-nav" aria-label="Navegación principal" data-role="auto" data-active="historial"></nav>
            <a href="../comun/index.html" class="logout" data-i18n="cerrarsesion">Cerrar Sesión</a>
        </aside>
        <main class="content-wrapper">
            <section class="barra-preferencias" aria-label="Idioma y tema">
                <button type="button" data-lang="zh" lang="zh" aria-pressed="false">中文</button>
                <button type="button" data-lang="es" lang="es" aria-pressed="true">Español</button>
                <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
                <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false"><i class="fa-solid fa-moon" aria-hidden="true"></i>Tema oscuro</button>
            </section>
            <header class="top-header">
                <h1 data-i18n="detalleTicket">Detalle del Ticket</h1>
                <p class="user-info" data-i18n="userNormal">Usuario</p>
            </header>
            <section class="main-content" id="contenido">
                <article class="widget form-container">
                    <a href="../alumno/misIncidencias.html" class="enlace-volver" data-i18n="backlist">&larr; Volver al Listado</a>
                    <h2 data-i18n="ticketinfo">Detalle del Ticket Nº #</h2>
                    <h3 data-i18n="solicitudinfo">Detalles de la Solicitud</h3>
                    <dl class="ticket-datos">
                        <dt data-i18n="creadoinfo">Creado por:</dt><dd>#</dd>
                        <dt data-i18n="equipoinfo">Equipo:</dt><dd>#</dd>
                        <dt data-i18n="ubicacion">Ubicación:</dt><dd>Planta # - Aula #</dd>
                        <dt data-i18n="estadoinfo">Estado:</dt><dd>#</dd>
                        <dt data-i18n="descripcioninfo">Descripción:</dt><dd>#</dd>
                    </dl>
                </article>
            </section>
        </main>
    </section>
</body>
</html>

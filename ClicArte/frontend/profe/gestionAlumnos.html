<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Alumnos | ClicArte</title>
        <link rel="stylesheet" href="../estilos.css">
    </head>
<body class="page-app">
    <section class="dashboard-container">
        <aside class="sidebar">
            <header class="logopaginas">
                <a href="../comun/dashboard.html">
                    <img src="../IMGBLANCO/logo_completo_negativp.png" alt="ClicArte">
                </a>
            </header>
            <nav class="sidebar-nav" aria-label="Navegación principal">
                <a href="../comun/dashboard.html">
                    <img src="../IMGBLANCO/dashboard.png" alt="">Dashboard
                </a>
                <a href="profesorEquipos.html">
                    <img src="../IMGBLANCO/equipo.png" alt="">Equipos
                </a>
                <a href="gestionAlumnos.html" class="activo">
                    <img src="../IMGBLANCO/alumno.png" alt="">Alumnos y profesores</a>
                    <a href="gestionAulas.html">
                        <img src="../IMGBLANCO/aula.png" alt="">Aulas
                    </a>
                    <a href="profesorIncidencias.html">
                        <img src="../IMGBLANCO/incidencia.png" alt="">Incidencias/Solicitudes
                    </a>
            </nav>
            <a href="../comun/index.html" class="logout">Cerrar Sesión</a>
        </aside>
        <main class="content-wrapper">
            <header class="top-header">
                <h1>Gestión de Alumnos</h1>
                <span class="user-info">Profesor</span>
            </header>
            <section class="main-content">
                <details>
                    <summary>Añadir Nuevo Usuario (Alumno/Profesor)</summary>
                    <article class="form-container">
                        <form action="#" method="post">
                            <section class="form-grid">
                                <p>
                                    <label for="nombre">Nombre:</label>
                                    <input type="text" id="nombre" name="nombre">
                                </p>
                                <p>
                                    <label for="apellidos">Apellidos:</label>
                                    <input type="text" id="apellidos" name="apellidos">
                                </p>
                                <p>
                                    <label for="correo">Correo:</label>
                                    <input type="email" id="correo" name="correo">
                                </p>
                                <p>
                                    <label for="rol">Rol:</label>
                                    <select id="rol" name="rol">
                                        <option>Alumno</option>
                                        <option>Profesor</option>
                                    </select>
                                </p>
                            </section>
                    <button type="submit">Guardar Usuario</button>
                        </form>
                    </article>
                </details>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>Curso</th>
                            <th>Especialidad</th>
                            <th>Turno</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#</td>
                            <td>#</td>
                            <td>#</td>
                            <td>#</td>
                            <td>#</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <title>Equipos del centro (profesorado) | ClicArte</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="../css/main.css">
        <script src="../js/theme.js"></script>
        <script src="../js/sidebar.js" defer></script>
        <script src="../js/equipment-search.js" defer></script>
    </head>
<body class="page-app">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
    <section class="app-shell">
        <aside class="sidebar">
            <header class="logopaginas">
                <a href="../comun/dashboard.html">
                    <img src="../IMGBLANCO/logo_completo_negativp.png" alt="ClicArte, ir al panel principal">
                </a>
            </header>
            <nav class="sidebar-nav" aria-label="Navegación principal" data-role="profesor" data-active="equipos"></nav>
            <a href="../comun/index.html" class="logout">Cerrar Sesión</a>
        </aside>
        <main class="content-wrapper">
            <section class="barra-preferencias" aria-label="Idioma y tema">
                <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false"><i class="fa-solid fa-moon" aria-hidden="true"></i>Tema oscuro</button>
            </section>
            <header class="top-header">
                <h1>Equipos del centro</h1>
                <p class="user-info">Profesor</p>
            </header>
            <section class="main-content" id="contenido">
                <p>Aquí puedes ver el listado de todos los equipos del centro.</p>
                <label class="equipment-search">
                    <span>Buscar equipo</span>
                    <input id="equipmentSearch" type="search" placeholder="Nombre, tipo, aula..." autocomplete="off">
                </label>
                <p class="equipment-search-status" id="equipmentSearchStatus" role="status" aria-live="polite"></p>
                <section class="table-container" role="region" aria-labelledby="caption-equipos-centro" tabindex="0">
                    <table>
                        <caption id="caption-equipos-centro">Equipos del centro con su ubicación, estado y persona asignada</caption>
                        <thead>
                            <tr>
                                <th scope="col">Nº</th>
                                <th scope="col">Tipo</th>
                                <th scope="col">Nº Equipo</th>
                                <th scope="col">Planta</th>
                                <th scope="col">Aula</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Asignado a</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="equipment-search-item">
                                <td>#</td>
                                <td>#</td>
                                <td>#</td>
                                <td>#</td>
                                <td>#</td>
                                <td>#</td>
                                <td>#</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </section>
        </main>
    </section>
</body>
</html>

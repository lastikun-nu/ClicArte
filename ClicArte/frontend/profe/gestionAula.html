<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Aulas | ClicArte</title>
        <link rel="stylesheet" href="../css/main.css">
    </head>
<body class="page-app">
    <section class="dashboard-container">
         <aside class="sidebar">
            <header class="logopaginas">
                <a href="../comun/dashboard.html">
                    <img src="../IMGBLANCO/logo_completo_negativp.png" alt="ClicArte">
                </a>
            </header>
            <nav class="sidebar-nav" aria-label="Navegación principal" data-role="profesor" data-active="aulas"></nav>
            <a href="../comun/index.html" class="logout">Cerrar Sesión
            </a>
        </aside>
        <main class="content-wrapper">
            <header class="top-header">
                <h1>Gestión de Aulas</h1>
                <span class="user-info">Profesor</span>
            </header>
            <section class="main-content">
                <p>Listado de equipos y alumnos asignados a cada aula.</p>
                <article class="aula-container">
                    <header class="aula-header">
                        <h2>Planta # - Aula #</h2>
                    </header>
                    <section class="aula-body">
                        <section class="aula-columna">
                            <h3>Equipos en esta aula</h3>
                            <ul><li># - # (Estado #)</li></ul>
                        </section>
                        <section class="aula-columna">
                            <h3>Alumnos asignados a esta aula</h3>
                            <ul><li>#</li></ul>
                        </section>
                    </section>
                </article>
            </section>
        </main>
    </section>
</body>
</html>

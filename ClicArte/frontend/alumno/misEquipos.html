<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <title>Mis equipos | ClicArte</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="../css/main.css">
        <script src="../js/theme.js"></script>
        <script src="../js/sidebar.js" defer></script>
        <script src="../js/equipment-search.js" defer></script>
        <script src="../js/nuno.js" defer></script>
    </head>
<body class="page-app">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
    <section class="app-shell">
        <aside class="sidebar">
            <header class="logopaginas">
                <a href="../comun/dashboard.html">
                    <img src="../IMGBLANCO/logo_completo_negativp.png" alt="ClicArte, ir al panel principal">
                </a>
            </header>
            <nav class="sidebar-nav" aria-label="Navegación principal" data-role="alumno" data-active="equipos"></nav>
            <a href="../comun/index.html" class="logout" data-i18n="cerrarsesion">Cerrar Sesión</a>
        </aside>
        <main class="content-wrapper">
            <section class="barra-preferencias" aria-label="Idioma y tema">
                <button type="button" data-lang="zh" lang="zh" aria-pressed="false">中文</button>
                <button type="button" data-lang="es" lang="es" aria-pressed="true">Español</button>
                <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
                <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false"><i class="fa-solid fa-moon" aria-hidden="true"></i>Tema oscuro</button>
            </section>
            <header class="top-header">
                <h1 data-i18n="miequipo">Mis Equipos</h1>
                <p class="user-info" data-i18n="userNormal">Usuario</p>
            </header>
            <section class="main-content" id="contenido">
                <p data-i18n="tuequipo">Equipos que tienes asignados bajo tu responsabilidad:</p>
                <label class="equipment-search">
                    <span data-i18n="buscaequipo">Buscar equipo</span>
                    <input id="equipmentSearch" type="search" placeholder="Nombre, tipo, ubicación..." data-i18n-placeholder="searchbar" autocomplete="off">
                </label>
                <p class="equipment-search-status" id="equipmentSearchStatus" role="status" aria-live="polite"></p>
                <article class="equipo-card equipment-search-item">
                    <figure class="equipo-imagen">
                        <span data-i18n="imagenEquipo">Imagen Equipo #</span>
                    </figure>
                    <section class="equipo-detalles">
                        <h2 data-i18n="nequipo">Nº Equipo: #</h2>
                        <p><strong data-i18n="tipo">Tipo:</strong> #</p>
                        <p><strong data-i18n="ubicacion">Ubicación:</strong> #</p>
                        <p><strong data-i18n="estadoinfo">Estado:</strong> #</p>
                    </section>
                </article>
            </section>
        </main>
    </section>
</body>
</html>

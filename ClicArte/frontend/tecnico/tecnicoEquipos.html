<body class="page-app">
    <section class="dashboard-container">
        <aside class="sidebar">
            <header class="logopaginas">
                <a href="../comun/dashboard.html">
                    <img src="../IMGBLANCO/logo_completo_negativp.png" alt="ClicArte">
                </a>
            </header>
            <nav class="sidebar-nav" aria-label="Navegación principal">
            <a href="../comun/dashboard.html">
                <img src="../IMGBLANCO/dashboard.png" alt="">Dashboard</a>
                <a href="tecnicoEquipos.html" class="activo">
                <img src="../IMGBLANCO/equipo.png" alt="">Equipos</a>
                <a href="../profe/gestionAlumnos.html">
                <img src="../IMGBLANCO/alumno.png" alt="">Alumnos y profesores</a>
                <a href="../profe/gestionAulas.html">
                <img src="../IMGBLANCO/aula.png" alt="">Aulas</a>
                <a href="tecnicoIncidencias.html">
                <img src="../IMGBLANCO/incidencia.png" alt="">Incidencias/Solicitudes</a>
            </nav>
            <a href="../comun/index.html" class="logout">Cerrar Sesión</a>
        </aside><main class="content-wrapper">
            <header class="top-header">
                <h1>Gestión de Equipos</h1>
                <span class="user-info">Técnico</span>
            </header>
            <section class="main-content">
                <details>
                <summary>Añadir Nuevo Equipo</summary>
                <article class="form-container">
                    <form action="#" method="post">
                        <section class="form-grid">
                            <p><label for="tipo">Tipo:</label>
                                <input type="text" id="tipo" name="tipo">
                            </p>
                            <p><label for="numero">Nº Equipo:</label>
                                <input type="text" id="numero" name="numero">
                            </p>
                            <p><label for="serie">Nº Serie:</label>
                                <input type="text" id="serie" name="serie">
                            </p>
                            <p><label for="planta">Planta:</label>
                                <select id="planta" name="planta">
                                    <option>#</option>
                                </select>
                            </p>
                            <p><label for="aula">Aula:</label>
                                <select id="aula" name="aula">
                                    <option>#</option>
                                </select>
                            </p>
                        </section>
                        <button type="submit">Guardar Equipo</button>
                    </form>
                </article>
            </details>
            <table><thead>
                <tr><th>Nº</th>
                    <th>Tipo</th>
                    <th>Nº Equipo</th>
                    <th>Planta</th>
                    <th>Aula</th>
                    <th>Estado</th>
                    <th>Asignado a</th>
                </tr></thead>
                <tbody>
                    <tr><td>#</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                        <td>#</td>
                    </tr></tbody>
                </table>
            </section>
        </main>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClicArte - Iniciar Sesión</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body class="body-login">
    <main class="login-wrapper">
        <header class="logo-header"><img src="../IMGBLANCO/logo_completo_negativp.png" alt="Logo de ClicArte"></header>
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">Iniciar Sesión</h1>
            <form action="dashboard.html" method="get">
                <p class="input-group"><label for="correo">Correo Electrónico</label><input type="email" id="correo" name="correo" placeholder="ejemplo@campus.com"></p>
                <p class="input-group"><label for="pass">Contraseña</label><input type="password" id="pass" name="pass" placeholder="Contraseña"></p>
                <button type="submit" class="btn-login" formaction="../alumno/misIncidencias.html">ESTUDIANTE</button>
                <button type="submit" class="btn-login" formaction="../profe/gestionAlumnos.html">PROFESOR</button>
                <button type="submit" class="btn-login" formaction="../tecnico/tecnicoIncidencias.html">TÉCNICO</button>
            </form>
        </section>
    </main>
</body>
</html>

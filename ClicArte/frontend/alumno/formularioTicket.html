<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nueva Incidencia | ClicArte</title>
        <link rel="stylesheet" href="../css/main.css">
        <script src="../js/sidebar.js" defer></script>
        <script src="../js/nuno.js" defer></script>
    </head>
<body class="page-app">
    <section class="app-shell">
        <aside class="sidebar">
            <header class="logopaginas">
                <a href="../comun/dashboard.html">
                    <img src="../IMGBLANCO/logo_completo_negativp.png" alt="ClicArte">
                </a>
            </header>
                <nav class="sidebar-nav" aria-label="Navegación principal" data-role="alumno" data-active="incidencias"></nav>
            <a href="../comun/index.html" class="logout" data-i18n="cerrarsesion">Cerrar Sesión</a>
        </aside>
        <main class="content-wrapper">
            <div class="selector-idioma-alumno">
                <button type="button" data-lang="zh">中文</button>
                <button type="button" data-lang="es">Español</button>
                <button type="button" data-lang="en">English</button>
                <button type="button" id="theme-toggle" aria-label="Cambiar a tema claro">
                        <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
            </div>
            <header class="top-header">
                <h1 data-i18n="newincidencia">Nueva Incidencia</h1>
                <span class="user-info" data-i18n="userNormal">Usuario</span>
            </header>
            <section class="main-content">
                <article class="form-card">
                <h2 data-i18n="detalles">Detalles del problema</h2>
                    <form action="#" method="post">
                        <p class="form-group">
                            <label for="tipo" data-i18n="ayuda">¿Qué necesitas?</label>
                            <select id="tipo" name="tipo">
                                <option data-i18n="option1">Reportar una Incidencia</option>
                                <option data-i18n="option2">Hacer una Solicitud</option>
                            </select>
                        </p>
                        <p class="form-group">
                            <label for="equipo" data-i18n="equipafe">Equipo afectado:</label>
                            <select id="equipo" name="equipo">
                                <option>#</option>
                            </select>
                        </p>
                        <p class="form-group">
                            <label for="descripcion" data-i18n="description">Descripción detallada:</label>
                            <textarea id="descripcion" name="descripcion" rows="6" data-i18n-placeholder="descriptionPlaceholder" placeholder="Describe el problema..." ></textarea>
                        </p>
                        <button type="submit" class="btn-submit" data-i18n="enviarticket">Enviar Ticket</button>
                    </form> 
                </article>
            </section>
        </main>
    </section>
</body>
</html>
